# Variáveis: localmente vêm do .env (lido automaticamente pelo docker compose);
# no Portainer, da seção "Environment variables" da stack. Sem valor, vale o padrão após ":-".
services:
  apuracao:
    build: .
    # A imagem é sempre compilada do Dockerfile, nunca baixada de um registry
    # (sem isso, o "pull" do Portainer procura a imagem no Docker Hub e falha)
    pull_policy: build
    environment:
      TSE_BASE: ${TSE_BASE:-https://resultados.tse.jus.br/oficial}
      CICLO: ${CICLO:-ele2026}
      INICIO_APURACAO: ${INICIO_APURACAO:-2026-10-04T17:00:00-03:00}
      # Códigos de eleição: vazios = descobertos sozinhos no TSE (o 2º turno vem do campo cdt2 do 1º).
      # Preencha só para forçar um valor; divergência com o TSE vira aviso no log.
      ELEICAO_FEDERAL: ${ELEICAO_FEDERAL:-}
      ELEICAO_ESTADUAL: ${ELEICAO_ESTADUAL:-}
      ELEICAO_FEDERAL_2T: ${ELEICAO_FEDERAL_2T:-}
      ELEICAO_ESTADUAL_2T: ${ELEICAO_ESTADUAL_2T:-}
      INICIO_APURACAO_2T: ${INICIO_APURACAO_2T:-2026-10-25T17:00:00-03:00}
      CACHE_SEGUNDOS: ${CACHE_SEGUNDOS:-30}
      # Presidente (Brasil e UFs) + Governador; no 2º turno, reduz sozinho às UFs com disputa
      MONITORAR: ${MONITORAR:-br:1,*:1,*:3}
      MAX_CONEXOES: ${MAX_CONEXOES:-5000}
      MAX_INSCRICOES: ${MAX_INSCRICOES:-50000}
      VAPID_CONTATO: ${VAPID_CONTATO:-}
      VAPID_PUBLICA: ${VAPID_PUBLICA:-}
      VAPID_PRIVADA: ${VAPID_PRIVADA:-}
      # IA (DeepSeek): opcional. Sem DEEPSEEK_API_KEY, a linha do tempo usa só as frases-modelo.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      IA_INTERVALO_MIN: ${IA_INTERVALO_MIN:-15}
      NOTICIA_INTERVALO_MIN: ${NOTICIA_INTERVALO_MIN:-5}
      # Modo simulação: ensaio do 2º turno com TSE falso e dados fictícios. NUNCA em produção.
      SIMULACAO: ${SIMULACAO:-0}
      SIMULACAO_ESPERA_MIN: ${SIMULACAO_ESPERA_MIN:-2}
      SIMULACAO_DURACAO_MIN: ${SIMULACAO_DURACAO_MIN:-15}
      SIMULACAO_GERACAO_SEGUNDOS: ${SIMULACAO_GERACAO_SEGUNDOS:-20}
      # Fixos: dentro do container, sempre no volume e na porta 3000
      HISTORICO_DB: /app/data/eleicoes.db
      FOTOS_DIR: /app/data/fotos
      PORT: 3000
    ports:
      - "${PORTA_HOST:-3000}:3000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

volumes:
  dados:
