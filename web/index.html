<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Apuração 2026</title>
<script>
  // Define o tema antes da primeira pintura (sem flash). Sem preferência salva, segue o sistema.
  (function () {
    try {
      var t = localStorage.getItem('eleicoes2026:tema');
      if (t !== 'claro' && t !== 'escuro') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
      document.documentElement.setAttribute('data-tema', t);
    } catch (e) {
      document.documentElement.setAttribute('data-tema', matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro');
    }
  })();
</script>
<meta name="description" content="Resultados das eleições 2026 com dados do TSE, atualizados durante a apuração.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icones/icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Apuração">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#edf1f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<div id="raiz"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
